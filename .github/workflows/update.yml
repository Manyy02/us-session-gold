name: Mise à jour du tableau de bord

on:
  schedule:
    # Heures en UTC. Séance US (≈ 13h–23h Paris) : toutes les 15 min, du lundi au vendredi.
    - cron: "*/15 12-22 * * 1-5"
    # Le reste du temps : une fois par heure (nuit, week-end).
    - cron: "5 0-11,23 * * 1-5"
    - cron: "5 */3 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Mémoire entre deux exécutions : copie de secours du calendrier ForexFactory
      # et liste des alertes déjà envoyées (pour ne jamais notifier deux fois).
      - uses: actions/cache@v4
        with:
          path: |
            calendar_backup.json
            notify_state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Générer la page avec les données du moment
        run: |
          for i in 1 2 3; do python export_artifact.py --pages && break; echo "Nouvel essai dans 30 s"; sleep 30; done
          test -s site/index.html
      - name: Diagnostic direct YouTube
        run: python -c "import sys; sys.argv.append('--debug-live'); import server; print(server.load_live())"
        continue-on-error: true
      - name: Notifications téléphone (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub suspend les tâches planifiées d'un dépôt sans activité pendant 60 jours :
  # ce petit job enregistre une date le 1er de chaque mois (vers 00h UTC) pour garder le robot actif.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "00" ]; then
            date -u +%F > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Maintien du robot actif" && git push || true
          fi
